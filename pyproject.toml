[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swing-control"
version = "0.1.0"
description = "自然语言无人机控制 — MATLAB/Simulink 仿真验证平台"
requires-python = ">=3.10"

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
addopts = "-v --tb=short"